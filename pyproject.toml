[tool.poetry]
name = "mexicali-zone"
version = "0.1.0"
description = ""
authors = ["RodolfoFigueroa <4rodolfofigueroa2@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.11,<3.12"
geopandas = "^1.0.1"
rasterio = "^1.4.3"
ipykernel = "^6.29.5"
matplotlib = "^3.9.3"
contextily = "^1.6.2"
seaborn = "^0.13.2"
osmnx = "^2.0.0"
scikit-learn = "^1.6.0"
pandana = "^0.7"
numpy="^1.26.4"
mapclassify = "^2.8.1"
plotly = "^5.24.1"
nbformat = "^5.10.4"
openpyxl = "^3.1.5"
python-dotenv = "^1.1.0"
notebook = "^7.4.3"
pandas-stubs = "^2.3.0.250703"
earthengine-api = "^1.6.2"
geemap = "^0.36.0"
geedim = "^1.9.1"
pykrige = "^1.7.2"
binsreg = "^2.1.7"
scikit-image = "^0.25.2"
libpysal = "^4.13.0"
esda = "^2.7.1"
scikit-gstat = "^1.0.21"
pyinterpolate = "^1.0.3"
photutils = "^2.2.0"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff.lint]
select = ["ALL"]
ignore = ["D"]

[tool.basedpyright]
typeCheckingMode = "standard"
ignore = ["**/*.ipynb"]